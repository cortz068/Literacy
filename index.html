<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Title</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        nav {
            margin-top: 15px;
            border-top: 1px solid #cccccc;
            padding-top: 10px;
        }

        nav a {
            color: #000000;
            text-decoration: underline;
            margin-right: 15px;
            font-size: 14px;
        }

        .main-layout {
            display: flex;
            gap: 30px;
        }

        .main-content {
            flex: 2;
        }

        .sidebar {
            flex: 1;
            border-left: 1px solid #cccccc;
            padding-left: 20px;
        }

        section {
            margin-bottom: 25px;
        }

        h2 {
            font-size: 18px;
            text-transform: uppercase;
            border-bottom: 1px solid #000000;
            padding-bottom: 3px;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        p {
            margin-bottom: 10px;
            font-size: 15px;
        }

        ul {
            list-style-type: square;
            padding-left: 20px;
            margin-bottom: 15px;
        }

        li {
            margin-bottom: 5px;
        }

        a {
            color: #0000ee;
        }

        .profile-img {
            width: 100%;
            height: auto;
            border: 1px solid #000000;
            margin-bottom: 10px;
        }

        footer {
            margin-top: 40px;
            border-top: 1px solid #000000;
            padding-top: 15px;
            font-size: 12px;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>Welcome</h1>
            <p>Text here...</p>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#journey">Literacy Journey</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <div class="main-layout">

            <main class="main-content">

                <section id="about">
                    <h2>About Me</h2>
                    <p>Text 1..</p>
                    <p>Text 2...</p>
                </section>

                <section id="journey">
                    <h2>T1</h2>
                    <p>1.</p>
                    <p>2..</p>
                    <p><a href="#" class="btn">3 &rarr;</a></p>
                </section>

            </main>

            <aside class="sidebar">

                <section>
                    <h3>Profile</h3>
                    <img src="https://via.placeholder.com/250x250" alt="My Profile Picture" class="profile-img">
                    <p><strong>Name:</strong> Xavier</p>
                    <p><strong>Location:</strong> Weslaco</p>
                </section>

                <section>
                    <h3>Test</h3>
                    <ul>
                        <li><a href="#">1</a></li>
                        <li><a href="#">2</a></li>
                        <li><a href="#">3</a></li>
                    </ul>
                </section>

                <section id="contact">
                    <h3>Connect</h3>
                    <p>Email: <a href="mailto:name@example.com">name@example.com</a></p>
                </section>

            </aside>

        </div>

        <footer>
            <p>&copy; 2015 [Your Name] | Built with plain HTML & CSS</p>
        </footer>

    </div>

</body>
</html>
